name: HOLDed — Full Resync (daily 03:00 UTC)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Dry-run (no DB writes)"
        required: false
        default: "false"
      max_docs:
        description: "Max documents to process (0 = unlimited)"
        required: false
        default: "5000"

concurrency:
  group: holded-full-resync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CONCURRENCY: "8"
      BATCH_SIZE: "100"
      MAX_DOCS: "5000"
      PREVIEW: "false"

    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run full resync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
          CONCURRENCY: ${{ env.CONCURRENCY }}
          BATCH_SIZE: ${{ env.BATCH_SIZE }}
          MAX_DOCS: ${{ github.event.inputs.max_docs || env.MAX_DOCS }}
          PREVIEW: ${{ github.event.inputs.preview || env.PREVIEW }}
        run: |
          set -euo pipefail
          pnpm exec -- tsx scripts/holded-full-resync.ts
