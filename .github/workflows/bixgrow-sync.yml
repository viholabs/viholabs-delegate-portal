name: BixGrow Affiliate Sync

on:
  schedule:
    # Every day at 04:00 UTC (after the Holded full resync at 03:00 UTC)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Dry-run only (no DB writes)"
        required: false
        default: "false"

jobs:
  sync:
    name: Sync BixGrow affiliates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BixGrow affiliate sync
        env:
          BIXGROW_API_KEY: ${{ secrets.BIXGROW_API_KEY }}
          BIXGROW_APP_ID: ${{ secrets.BIXGROW_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
        run: pnpm exec -- tsx scripts/bixgrow-sync-affiliates.ts
