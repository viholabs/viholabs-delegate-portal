# =============================================================================
# nginx config — portal.viholabs.com
# Instalación en VPS:
#   cp /var/www/portal/nginx/portal.viholabs.com.conf /etc/nginx/sites-available/portal.viholabs.com
#   ln -s /etc/nginx/sites-available/portal.viholabs.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# =============================================================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=portal_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=portal_auth:10m    rate=10r/m;

upstream nextjs_portal {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name portal.viholabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.viholabs.com;

    # SSL (Let's Encrypt via certbot)
    ssl_certificate     /etc/letsencrypt/live/portal.viholabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.viholabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Bloquear endpoints de debug (exponen datos de sesión)
    location = /api/debug/cookies     { return 404; }
    location = /api/security/rls-smoke {
        # Descomentar para dar acceso desde IP de oficina:
        # allow 1.2.3.4;
        # deny all;
        return 404;
    }

    # Holded sync — solo desde localhost (cron del servidor)
    location = /api/holded/invoices/import-incremental {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://nextjs_portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
    location = /api/holded/incremental {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://nextjs_portal;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }

    # Webhook Bixgrow — sin rate limit, sin bloqueo de Authorization
    location = /api/webhooks/bixgrow {
        proxy_pass         http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_pass_header  Authorization;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth — rate limit estricto
    location ~ ^/(login|forgot-password|set-password|api/auth/) {
        limit_req zone=portal_auth burst=5 nodelay;
        proxy_pass         http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_pass_header  Authorization;
        proxy_cache_bypass $http_upgrade;
    }

    # Assets estáticos — caché larga, sin logs
    location /_next/static/ {
        proxy_pass         http://nextjs_portal;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # Aplicación principal
    location / {
        limit_req zone=portal_general burst=20 nodelay;

        proxy_pass         http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # Pasar Authorization (cinturón y tirantes — x-viholabs-token es la vía principal)
        proxy_pass_header  Authorization;
        proxy_cache_bypass $http_upgrade;

        # Timeouts generosos para operaciones Holded lentas
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        client_max_body_size 20M;
    }

    access_log /var/log/nginx/portal.viholabs.com.access.log;
    error_log  /var/log/nginx/portal.viholabs.com.error.log warn;
}
